name: verify-binaries

on:
  push:
    paths:
      - 'bin/ttfx-bg-rs/**'
      - 'ttfx-src'
      - '.github/workflows/verify-binaries.yml'
  workflow_dispatch:

jobs:
  x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc libgtk-4-dev libvte-2.91-gtk4-dev
      - name: Rebuild wrapper from pinned source
        working-directory: bin/ttfx-bg-rs
        run: cargo build --release
      - name: Compare SHA-256 with bundled binary
        run: |
          echo "rebuilt:  $(sha256sum bin/ttfx-bg-rs/target/release/ttfx-bg-rs | cut -d' ' -f1)"
          echo "bundled:  $(sha256sum bin/ttfx-bg-rs-x86_64 | cut -d' ' -f1)"
          cmp bin/ttfx-bg-rs/target/release/ttfx-bg-rs bin/ttfx-bg-rs-x86_64 \
            && echo "MATCH: bundled x86_64 binary == source build"

  aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install toolchain + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cargo rustc libgtk-4-dev libvte-2.91-gtk4-dev
      - name: Rebuild wrapper from pinned source
        working-directory: bin/ttfx-bg-rs
        run: cargo build --release
      - name: Compare SHA-256 with bundled binary
        run: |
          echo "rebuilt:  $(sha256sum bin/ttfx-bg-rs/target/release/ttfx-bg-rs | cut -d' ' -f1)"
          echo "bundled:  $(sha256sum bin/ttfx-bg-rs-aarch64 | cut -d' ' -f1)"
          cmp bin/ttfx-bg-rs/target/release/ttfx-bg-rs bin/ttfx-bg-rs-aarch64 \
            && echo "MATCH: bundled aarch64 binary == source build"
